<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: a vault map of 9 locks; each lock opens a one-card-at-a-time lesson (learn → try → practice → key unlocked). Single committed look: navy vault, cream cards, gold keys. */
:root{
  --vault:#13203f; --vault-2:#1d2d55; --gold:#f2b705; --gold-deep:#c98f00;
  --card:#fffaf0; --ink:#1b2240; --muted:#5b6283; --line:#e6dcc6;
  --good:#1f9d6b; --good-bg:#e3f6ec; --try:#d9822b; --try-bg:#fff0de; --miss:#c2416b; --miss-bg:#fde7ee;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--vault);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;
  background-image:radial-gradient(circle at 15% 10%,rgba(242,183,5,.10),transparent 40%),radial-gradient(circle at 85% 90%,rgba(90,140,255,.12),transparent 45%);min-height:100%}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#fff;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo-spot{width:64px;height:64px;border-radius:14px;border:2px dashed rgba(242,183,5,.6);display:grid;place-items:center;overflow:hidden;flex:none}
.logo-spot img{width:100%;height:100%;object-fit:contain}
.brand small{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.brand b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.02em}
.score-pill{background:var(--vault-2);border:2px solid var(--gold);color:#fff;border-radius:999px;padding:6px 16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.score-pill span{color:var(--gold)}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
.hero{color:#fff;text-align:left;margin:8px 0 22px}
.hero h1{font-size:clamp(34px,7vw,56px);color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero p{max-width:60ch;margin:8px 0 0;color:#dfe6ff}
.card{background:var(--card);border-radius:22px;padding:24px;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.name-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
input[type=text],textarea{font:inherit;font-size:18px;border:3px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;color:var(--ink);width:100%}
input[type=text]{flex:1 1 220px;width:auto}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
.btn{font:inherit;font-weight:700;font-size:18px;border:none;border-radius:14px;padding:12px 20px;cursor:pointer;background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}
.btn:focus-visible,.opt:focus-visible,.lock:focus-visible,.tapline:focus-visible{outline:4px solid #5a8cff;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 3px var(--line)}
.btn.dark{background:var(--vault-2);color:#fff;box-shadow:0 4px 0 #0b1430}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* map */
.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:620px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lock{border:none;font:inherit;text-align:left;cursor:pointer;border-radius:20px;padding:16px;background:var(--card);color:var(--ink);position:relative;box-shadow:0 6px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;gap:6px;min-height:150px;border-top:10px solid var(--c)}
.lock .num{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lock h3{font-size:21px}
.lock p{margin:0;font-size:15px;color:var(--muted)}
.lock .status{margin-top:auto;font-weight:700;font-size:15px}
.lock.done{background:#fff6d6}
.lock.done .status{color:var(--good)}
.keyicon{position:absolute;top:10px;right:12px;width:34px;height:34px}
/* station */
.station-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#fff;margin-bottom:12px}
.station-head h2{font-size:clamp(24px,5vw,34px);color:#fff}
.station-head .eyebrow{color:var(--gold);font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.progress{height:14px;background:var(--vault-2);border-radius:999px;overflow:hidden;margin-bottom:16px;border:2px solid rgba(255,255,255,.15)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd95a);border-radius:999px;transition:width .4s}
.step-tag{display:inline-block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--c);color:#fff;margin-bottom:10px}
.card h3{font-size:28px;margin-bottom:10px;color:var(--ink)}
.card p{margin:0 0 12px;max-width:68ch}
.card ul{margin:0 0 12px;padding-left:22px}
.card li{margin-bottom:6px}
.term{font-weight:700;color:var(--c)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0 14px}
.chip{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:16px}
.chip b{color:var(--c);font-size:18px}
.tip{background:#fff;border-left:6px solid var(--gold);border-radius:12px;padding:12px 14px;margin:12px 0}
.passage{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 16px;font-size:18px}
.passage .pt{font-family:var(--display);font-size:20px;margin-bottom:6px;color:var(--c)}
.poem{white-space:pre-line;font-style:italic}
.dok{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:2px solid var(--line);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.grp{color:var(--gold);font-size:clamp(22px,4.5vw,30px);margin:22px 0 2px}
.grp-note{color:#dfe6ff;margin:0 0 12px}
.q{font-weight:700;font-size:20px;margin:0 0 12px}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:12px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt .ltr{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt.sel{border-color:var(--c);background:#f6f3ff}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--miss);background:var(--miss-bg);opacity:.75}
.opt[disabled]{cursor:default}
.tapline{display:block;width:100%;font:inherit;text-align:left;border:2px dashed transparent;background:transparent;color:var(--ink);border-radius:10px;padding:6px 8px;cursor:pointer;margin:2px 0}
.tapline:hover:not([disabled]){background:#fff6d6;border-color:var(--gold)}
.tapline.right{background:var(--good-bg);border:2px solid var(--good)}
.tapline.wrong{background:var(--miss-bg);border:2px solid var(--miss);opacity:.75}
.order-bank,.order-ans{display:flex;flex-direction:column;gap:8px;min-height:50px}
.order-ans{background:#fff;border:3px dashed var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
.order-ans .opt .ltr{background:var(--gold);color:var(--ink)}
.feedback{margin-top:14px;border-radius:14px;padding:14px 16px;font-size:17px}
.feedback.good{background:var(--good-bg);border:2px solid var(--good)}
.feedback.hint{background:var(--try-bg);border:2px solid var(--try)}
.feedback.miss{background:var(--miss-bg);border:2px solid var(--miss)}
.feedback b.big{display:block;font-family:var(--display);font-weight:400;font-size:22px;margin-bottom:4px}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.starters button{font:inherit;font-size:15px;border:2px solid var(--c);color:var(--ink);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
textarea{min-height:150px;resize:vertical}
.wc{font-size:14px;color:var(--muted);margin-top:4px}
.model{background:#fff;border:2px dashed var(--c);border-radius:12px;padding:12px 14px;margin-top:10px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.speak{font:inherit;font-size:15px;font-weight:700;border:2px solid var(--c);background:#fff;color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;float:right;margin:0 0 8px 10px}
.example-reveal{margin-top:10px}
.bigkey{display:block;margin:6px auto 10px;width:120px;height:120px;animation:spin 1.4s ease-out}
.bigkey svg,.keyicon svg{width:100%;height:100%;display:block}
@keyframes spin{from{transform:rotate(-200deg) scale(.3)}to{transform:none}}
.center{text-align:center}
.center p{margin-left:auto;margin-right:auto}
.cert{border:6px double var(--gold);border-radius:22px;padding:22px;text-align:center;background:#fffdf5}
.cert h2{font-size:clamp(28px,6vw,44px);color:var(--gold-deep)}
.cert .who{font-family:var(--display);font-size:clamp(30px,7vw,48px);color:var(--ink);margin:8px 0}
.tally{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:14px 0;text-align:left}
.tally div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(150%);background:var(--gold);color:var(--ink);font-family:var(--display);font-size:22px;padding:12px 22px;border-radius:999px;box-shadow:0 6px 0 var(--gold-deep);transition:transform .3s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
svg text{font-family:var(--body)}
footer{color:#aab4d6;font-size:13px;text-align:center;margin-top:26px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  </header>
  <main id="app"></main>

</div>

<script>
/* ============ CONTENT ============ */
const KEY_SVG = c => `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="20" cy="22" r="13" fill="none" stroke="${c}" stroke-width="7"/><path d="M29 31 L54 56 M44 46 L50 40 M49 51 L55 45" stroke="${c}" stroke-width="7" stroke-linecap="round"/></svg>`;

const PLOT_SVG = `<div style="overflow-x:auto"><svg viewBox="0 0 640 230" style="width:100%;min-width:480px;max-width:100%;height:auto" role="img" aria-label="Plot diagram mountain">
<polyline points="20,190 150,190 330,40 470,150 620,150" fill="none" stroke="#2c7be5" stroke-width="6" stroke-linejoin="round"/>
<circle cx="330" cy="40" r="10" fill="#f2b705" stroke="#1b2240" stroke-width="3"/>
<text x="30" y="215" font-size="17" fill="#1b2240" font-weight="700">1. Exposition</text>
<text x="168" y="135" font-size="17" fill="#1b2240" font-weight="700" transform="rotate(-38 168 135)">2. Rising Action</text>
<text x="290" y="22" font-size="17" fill="#1b2240" font-weight="700">3. Climax</text>
<text x="400" y="80" font-size="17" fill="#1b2240" font-weight="700">4. Falling Action</text>
<text x="480" y="178" font-size="17" fill="#1b2240" font-weight="700">5. Resolution</text>
</svg></div>`;

const GROUPS = [
 {g:"genres", title:"Vocabulary & Reading Across Genres", note:"The biggest part of the test! Almost half the questions come from these skills."},
 {g:"prose", title:"Reading Stories & Poems", note:"About one out of every three questions."},
 {g:"info", title:"Reading Informational Text", note:"About one out of every three questions."}
];

const STATIONS = [
/* ================= GENRES & VOCAB ================= */
{ id:"parts", g:"genres", color:"#2a9d8f", title:"Word Parts", blurb:"Prefixes, roots & suffixes",
  learn:[
   {h:"Unlock words with word parts", html:`<p>Long words are built from smaller parts. Each part is a clue to the meaning.</p>
   <ul><li><span class="term">Prefix</span>: comes at the <b>beginning</b> and changes the meaning. <i>re</i>play = play again.</li>
   <li><span class="term">Root</span>: the <b>main part</b> that holds the meaning. <i>port</i> = carry.</li>
   <li><span class="term">Suffix</span>: comes at the <b>end</b>. It can change the meaning or the part of speech. fear<i>less</i> = without fear.</li></ul>`},
   {h:"Your key ring of word parts", html:`<p><b>Prefixes</b></p><div class="chips">
   <div class="chip"><b>un- / dis- / im-</b> = not</div><div class="chip"><b>re-</b> = again</div><div class="chip"><b>pre-</b> = before</div><div class="chip"><b>mis-</b> = wrongly</div>
   <div class="chip"><b>sub-</b> = under</div><div class="chip"><b>inter-</b> = between</div><div class="chip"><b>trans-</b> = across</div><div class="chip"><b>tele-</b> = far</div></div>
   <p><b>Roots</b></p><div class="chips">
   <div class="chip"><b>port</b> = carry</div><div class="chip"><b>dict</b> = say</div><div class="chip"><b>spect</b> = look</div><div class="chip"><b>aud</b> = hear</div>
   <div class="chip"><b>graph / scrib</b> = write</div><div class="chip"><b>struct</b> = build</div><div class="chip"><b>bio</b> = life</div><div class="chip"><b>chron</b> = time</div></div>
   <p><b>Suffixes</b></p><div class="chips">
   <div class="chip"><b>-less</b> = without</div><div class="chip"><b>-ful</b> = full of</div><div class="chip"><b>-able</b> = can be done</div><div class="chip"><b>-ist / -er</b> = a person who</div>
   <div class="chip"><b>-ology</b> = study of</div><div class="chip"><b>-tion</b> = act of</div></div>`},
   {h:"The 4-step word unlock", html:`<ul><li><b>1. Break it</b> into parts.</li><li><b>2. Define</b> each part.</li><li><b>3. Put it together</b> in your own words.</li><li><b>4. Check it</b> in the sentence. Does it make sense?</li></ul>`}
  ],
  example:{q:`What does <b>unbreakable</b> mean?`,a:`<b>Break it:</b> un + break + able. <b>Define:</b> un = not, able = can be. <b>Put it together:</b> not able to be broken. <b>Check:</b> "an unbreakable phone case" = a case that can't be broken. It makes sense!`},
  qs:[
   {t:"mc",d:1,q:`The prefix <b>pre-</b> in <i>preview</i> means…`,opts:["again","before","not","across"],a:1,hint:"Check the prefix list on your key ring.",why:"Pre- means before. A preview is a look at something before it comes out."},
   {t:"mc",d:1,q:`What does the suffix <b>-less</b> mean in the word <i>fearless</i>?`,opts:["full of","again","without","a person who"],a:2,hint:"Think of other words: homeless, careless.",why:"-less means without, so fearless means without fear."},
   {t:"mc",d:2,passage:`The <b>transcontinental</b> railroad let travelers ride a train from the Atlantic coast all the way to the Pacific coast.`,q:"What does <b>transcontinental</b> mean?",opts:["going across a continent","built underground","going back again","staying in one city"],a:0,hint:"Trans- means across. The sentence says from one coast to the other.",why:"Trans- means across, so transcontinental means going across the whole continent, coast to coast."},
   {t:"mc",d:2,passage:`Our class needed <b>portable</b> chairs that we could carry outside for the reading picnic.`,q:"Based on the root <i>port</i> and the suffix <i>-able</i>, portable means…",opts:["very heavy","able to be carried","made of wood","used for writing"],a:1,hint:"Port = carry. -able = can be done. The sentence also says carry outside.",why:"Port means carry and -able means can be, so portable means able to be carried."},
   {t:"multi",d:2,q:`Select ALL the words with a prefix that means <b>not</b>.`,opts:["unhappy","replay","disagree","impossible","preheat"],a:[0,2,3],hint:"Look for un-, dis-, and im-.",why:"Unhappy, disagree, and impossible all have prefixes meaning not. Re- means again and pre- means before."}
  ]},
{ id:"context", g:"genres", color:"#0f7fa8", title:"Context & Connotation", blurb:"Clues and word feelings",
  learn:[
   {h:"Context clues", html:`<p>When you don't know a word, the words around it can help. Those are <span class="term">context clues</span>.</p>
   <ul><li><b>Definition</b>: the sentence tells you the meaning. <i>A <b>botanist</b>, a scientist who studies plants…</i></li>
   <li><b>Synonym</b>: a word nearby means the same. <i>She was <b>exhausted</b>, so tired she could barely stand.</i></li>
   <li><b>Antonym</b>: a word nearby means the opposite. Look for <i>unlike, but, however</i>.</li>
   <li><b>Example</b>: examples show the meaning. <i>…<b>reptiles</b>, such as snakes and lizards.</i></li></ul>`},
   {h:"Denotation vs. connotation", html:`<ul><li><span class="term">Denotation</span>: the dictionary meaning of a word.</li>
   <li><span class="term">Connotation</span>: the <b>feeling</b> a word gives you: positive, negative, or neutral.</li></ul>
   <div class="tip"><b>Thrifty</b> and <b>cheap</b> both mean careful with money. But <i>thrifty</i> feels positive (smart) and <i>cheap</i> feels negative (stingy). Authors choose words to show how they feel.</div>
   <p><b>Test tip:</b> When two answers both look right, check the <b>tone</b> of the passage. Does the author sound positive or negative?</p>`}
  ],
  example:{q:`"The <b>aroma</b> of fresh cookies filled the kitchen." Is <i>aroma</i> positive, negative, or neutral?`,a:`<b>Positive.</b> Aroma and stench both mean a smell, but aroma means a pleasant smell. Fresh cookies fit that happy feeling.`},
  qs:[
   {t:"mc",d:1,q:"Which word has the most <b>negative</b> connotation?",opts:["slim","slender","thin","scrawny"],a:3,hint:"Which one sounds like an insult?",why:"All four mean not heavy, but scrawny sounds negative, like weak or unhealthy."},
   {t:"mc",d:2,passage:`Even though the hike was <b>arduous</b>, with steep climbs and rocky paths that made our legs ache, we finally reached the top.`,q:"What does <b>arduous</b> mean?",opts:["short and easy","very difficult","beautiful","boring"],a:1,hint:"Look at the clues: steep climbs, rocky paths, legs ache.",why:"Steep climbs and aching legs show the hike was very difficult."},
   {t:"mc",d:2,passage:`Grandpa saved every penny, fixed old things instead of buying new ones, and still bought gifts for everyone on their birthdays. I always admired how smart he was with money.`,q:"Which word best describes Grandpa in a way that matches the author's feelings?",opts:["cheap","stingy","thrifty","greedy"],a:2,hint:"The author admires him. Which word sounds positive?",why:"The author admires Grandpa, so the positive word thrifty fits. Cheap, stingy, and greedy all sound negative."},
   {t:"mc",d:2,q:`The author calls the small cabin "cozy" instead of "cramped." This word choice shows the author feels…`,opts:["warm and happy about the cabin","annoyed by the cabin","scared of the cabin","nothing about the cabin"],a:0,hint:"Does cozy feel positive or negative?",why:"Cozy and cramped both mean small, but cozy feels warm and positive, so the author likes the cabin."}
  ]},
{ id:"fig", g:"genres", color:"#e76f51", title:"Figurative Language", blurb:"Similes, metaphors & more",
  learn:[
   {h:"Words that paint pictures", html:`<p><span class="term">Figurative language</span> doesn't mean exactly what it says. It helps readers picture, hear, or feel something.</p>
   <ul><li><span class="term">Simile</span>: compares with <b>like</b> or <b>as</b>. <i>as quiet as a mouse</i></li>
   <li><span class="term">Metaphor</span>: says one thing <b>is</b> another. <i>The classroom was an oven.</i></li>
   <li><span class="term">Personification</span>: gives human actions to non-human things. <i>The wind whispered.</i></li>
   <li><span class="term">Hyperbole</span>: a huge exaggeration. <i>I've told you a million times!</i></li>
   <li><span class="term">Idiom</span>: a saying that means something different from its words. <i>Piece of cake</i> = easy.</li>
   <li><span class="term">Onomatopoeia</span>: a sound word. <i>Sizzle! Pop!</i></li></ul>`},
   {h:"Find it, then ask why", html:`<p>The test asks you to find figurative language, <b>and</b> explain what it means or why the author used it.</p>
   <div class="tip"><b>Locksmith question:</b> What is the author really saying? Turn the figurative words into plain words.</div>`}
  ],
  example:{q:`"My backpack weighed a ton." What does this really mean?`,a:`It is <b>hyperbole</b>. The backpack doesn't really weigh a ton. The author means it was <b>very heavy</b>.`},
  passage:{title:"Morning Market",lines:["The market woke up before the sun.","Vendors' voices bounced like rubber balls from stall to stall.","The fruit stand was a rainbow of mangoes, plums, and limes.","Sizzle! Pop! The onions hit the hot pan.","I could have eaten a hundred tamales."]},
  qs:[
   {t:"tap",d:1,q:"Tap the sentence that uses a <b>simile</b>.",a:1,hint:"Look for like or as.",why:"Voices bounced like rubber balls. The word like makes it a simile."},
   {t:"mc",d:1,q:`"The fruit stand was a rainbow of mangoes, plums, and limes." This is a…`,opts:["simile","metaphor","onomatopoeia","idiom"],a:1,hint:"It says the fruit stand WAS a rainbow, with no like or as.",why:"It compares the fruit stand to a rainbow without like or as. That is a metaphor."},
   {t:"mc",d:2,q:`What does "The market woke up before the sun" really mean?`,opts:["The market was sleeping.","The market got busy very early in the morning.","The sun was late.","The market closed at night."],a:1,hint:"Markets can't really wake up. What is the author saying in plain words?",why:"This personification means the market got busy before sunrise."},
   {t:"mc",d:2,q:`"I could have eaten a hundred tamales." What does this hyperbole show?`,opts:["The speaker counted the tamales.","The tamales were tiny.","The speaker was very hungry and the food smelled delicious.","The speaker doesn't like tamales."],a:2,hint:"Nobody eats a hundred tamales. What feeling is the exaggeration showing?",why:"The exaggeration shows the speaker was very hungry and the food was delicious."},
   {t:"mc",d:2,q:`"After winning the spelling bee, Ava was on cloud nine." This idiom means Ava was…`,opts:["extremely happy","confused","sleepy","floating in the air"],a:0,hint:"Idioms don't mean exactly what the words say. How do you feel after you win?",why:"On cloud nine is an idiom that means extremely happy."}
  ]},
{ id:"rhetoric", g:"genres", color:"#c0392b", title:"Rhetoric", blurb:"Ethos, pathos & logos",
  learn:[
   {h:"Three ways to persuade", html:`<ul><li><span class="term">Ethos</span> (trust): the author shows they are believable, like an expert. <i>"As a doctor for 20 years…"</i></li>
   <li><span class="term">Pathos</span> (feelings): the author tries to make you feel something. <i>"Imagine a puppy shivering in the cold."</i></li>
   <li><span class="term">Logos</span> (logic): the author uses facts, numbers, and reasons. <i>"Studies show…"</i></li></ul>
   <div class="tip"><b>Memory key:</b> <b>E</b>thos = <b>E</b>xpert. <b>P</b>athos = <b>P</b>assion. <b>L</b>ogos = <b>L</b>ogic.</div>`}
  ],
  example:{q:`"Nine out of ten students in our survey said they read more when they choose their own books." Which appeal?`,a:`<b>Logos.</b> It uses a number from a survey as evidence.`},
  qs:[
   {t:"mc",d:1,q:"<b>Logos</b> persuades readers by using…",opts:["emotions and feelings","facts, numbers, and reasons","the author's experience","funny jokes"],a:1,hint:"Logos = Logic.",why:"Logos uses logic: facts, numbers, and reasons."},
   {t:"mc",d:1,q:"Which appeal tries to make the reader <b>feel</b> something, like sad, proud, or scared?",opts:["ethos","pathos","logos","none"],a:1,hint:"Pathos = Passion.",why:"Pathos appeals to the reader's emotions."},
   {t:"mc",d:2,q:`"As a veterinarian for twelve years, I know how much shelter pets need loving homes." This sentence uses…`,opts:["ethos","pathos","logos","hyperbole"],a:0,hint:"Why should we trust this writer?",why:"Being a veterinarian for twelve years makes the writer believable. That is ethos."},
   {t:"mc",d:2,q:`"Picture a lonely kitten waiting in a cold cage for someone to love it." This sentence uses…`,opts:["ethos","pathos","logos","a counterclaim"],a:1,hint:"How does this sentence make you feel?",why:"The lonely kitten makes readers feel sad and caring. That is pathos."},
   {t:"mc",d:2,q:`Why would an author writing about animal shelters use the sentence about the lonely kitten?`,opts:["to give a fact about kittens","to make readers feel sympathy so they want to adopt","to show the author is an expert","to tell a funny story"],a:1,hint:"What does the author want readers to do?",why:"The author wants readers to feel sympathy so they will want to adopt a pet."}
  ]},
{ id:"compare", g:"genres", color:"#7b4fd6", title:"Comparing Texts", blurb:"Two texts, one topic",
  learn:[
   {h:"Same topic, different views", html:`<p>Sometimes the test gives you <b>two passages</b> about the same topic. You will need to compare them.</p>
   <ul><li><span class="term">Compare</span>: how the texts are <b>alike</b>.</li><li><span class="term">Contrast</span>: how the texts are <b>different</b>.</li>
   <li><span class="term">Perspective</span>: how an author <b>feels or thinks</b> about the topic.</li></ul>
   <div class="tip"><b>Locksmith steps:</b> 1. Read Text A and jot its main point. 2. Read Text B and jot its main point. 3. Ask: What is the same? What is different? How does each author feel?</div>`}
  ],
  example:{q:`Text A says, "Cell phones in class are a terrible distraction." Text B says, "Some teachers use cell phones for learning, while others worry about distractions." How are the perspectives different?`,a:`Text A has a <b>strong negative opinion</b>. Text B is <b>balanced</b> and shows both sides.`},
  passageHtml:`<div class="passage"><div class="pt">Text A: We Need a Skate Park!</div><p>by a 12-year-old skater</p><p>Right now, kids in our town skate in parking lots, where cars zoom past us. A skate park would give us a safe place to practice. It would also keep kids active and outside instead of on screens. Please vote YES on the skate park!</p></div>
  <div class="passage"><div class="pt">Text B: Town Council Discusses Skate Park</div><p>Last night, the town council heard ideas about building a skate park near the library. Supporters said kids need a safe place to skate away from traffic. Some neighbors worried the park could be noisy and asked about the cost. The council will vote next month.</p></div>`,
  qs:[
   {t:"mc",d:1,q:"What topic do BOTH texts discuss?",opts:["a new library","a plan to build a skate park","cars in parking lots","screen time"],a:1,hint:"What is each text mostly about?",why:"Both texts are about the plan to build a skate park."},
   {t:"mc",d:2,q:"How are the authors' perspectives different?",opts:["Text A strongly supports the skate park; Text B gives both sides.","Both texts are against the skate park.","Text A is neutral; Text B strongly supports it.","Both authors are skaters."],a:0,hint:"Which text says 'Please vote YES'? Which one tells what different people said?",why:"Text A pushes for the skate park. Text B is a news report that shows supporters and worried neighbors."},
   {t:"mc",d:2,q:"Which detail appears ONLY in Text B?",opts:["Kids need a safe place to skate.","Some neighbors worry about noise.","Cars are a danger.","A skate park is a good idea."],a:1,hint:"Text A only gives reasons FOR the park.",why:"Only Text B mentions neighbors worrying about noise and cost."},
   {t:"mc",d:2,q:"How are the two texts ALIKE?",opts:["Both ask readers to vote yes.","Both mention that kids need a safe place away from traffic.","Both are written by kids.","Both say the park costs too much."],a:1,hint:"Find an idea that is in Text A and Text B.",why:"Both texts say kids need a safe place to skate away from cars."},
   {t:"write",d:2,q:"Explain ONE way the two authors' perspectives are different. Use a detail from each text.",starters:["In Text A, the author ___.","For example, ___.","In Text B, the author ___.","This shows ___."],look:["text a","text b","support","both sides","neighbors","vote","safe","different"],model:"In Text A, the author strongly supports the skate park and says, \"Please vote YES.\" In Text B, the author is neutral and shares both sides, like supporters wanting a safe place and neighbors worrying about noise."}
  ]},
/* ================= PROSE & POETRY ================= */
{ id:"theme", g:"prose", color:"#2c7be5", title:"Story Elements & Theme", blurb:"Character, setting, plot & theme",
  learn:[
   {h:"Story elements", html:`<ul><li><span class="term">Character</span>: who the story is about. <b>Character traits</b> describe what they're like (brave, selfish, kind).</li>
   <li><span class="term">Setting</span>: when and where the story happens.</li>
   <li><span class="term">Plot</span>: the events: exposition, rising action, climax, falling action, resolution.</li>
   <li><span class="term">Conflict</span>: the problem the character faces.</li></ul>
   <div class="tip">Characters <b>change</b> because of the conflict. Watch what a character learns!</div>`},
   {h:"Theme: the story's lesson", html:`<p>The <span class="term">theme</span> is the message or lesson about life the author wants you to learn.</p>
   <ul><li>A <b>topic</b> is one or two words: <i>friendship</i>.</li><li>A <b>theme</b> is a full sentence: <i>True friends stand by you when times are hard.</i></li></ul>
   <div class="tip"><b>How to find it:</b> Ask "What did the main character learn?" Then turn it into a lesson for <b>anyone</b>, not just the character. Don't use character names in a theme.</div>`}
  ],
  example:{q:`A girl lies to her friend, feels terrible, and finally tells the truth. Her friend forgives her. Is "honesty" a theme?`,a:`No, <b>honesty</b> is a <b>topic</b>. A theme is a full sentence: <b>"Telling the truth is better than hiding a mistake, even when it is hard."</b>`},
  passage:{title:"The Last Lap",lines:[
   "Jamal was the fastest runner at Lakeview Middle School, and everyone knew it, because he told them every single day.",
   "While the rest of the track team ran laps after school, Jamal sat on the bleachers playing games on his phone. \"Why practice?\" he laughed. \"I already win.\"",
   "Lena, a quiet seventh grader, ran her laps every afternoon, even when it rained.",
   "At the county meet, Jamal shot ahead at the start. But on the last lap, his legs burned and his breath came in gasps. Lena glided past him and crossed the finish line first.",
   "After the race, Jamal walked over to Lena. \"Can I run with you tomorrow?\" he asked. She smiled. \"Practice starts at three.\""]},
  qs:[
   {t:"mc",d:1,q:"Where does the climax of the story take place?",opts:["in a classroom","on the bleachers","at the county meet","at Lena's house"],a:2,hint:"Where is the big race?",why:"The most exciting moment, when Lena passes Jamal, happens at the county meet."},
   {t:"mc",d:2,q:"Which word BEST describes Jamal at the beginning of the story?",opts:["shy","overconfident","hardworking","kind"],a:1,hint:"Look at what he says: 'Why practice? I already win.'",why:"Jamal brags every day and skips practice because he thinks he'll win. He is overconfident."},
   {t:"tap",d:2,q:"Tap the paragraph that shows Jamal is <b>changing</b>.",a:4,hint:"When does Jamal act differently than he did at the start?",why:"Asking Lena if he can run with her shows Jamal now understands practice matters."},
   {t:"mc",d:1,q:"Which is a <b>theme</b> of the story, not just a topic?",opts:["running","practice","Talent alone is not enough; steady hard work leads to success.","Lena wins the race."],a:2,hint:"A theme is a full-sentence lesson for anyone.",why:"Running and practice are topics, and 'Lena wins the race' is a plot event. The full-sentence lesson is the theme."},
   {t:"mc",d:2,q:"Which detail BEST supports the theme?",opts:["Jamal was the fastest runner at Lakeview.","Lena ran her laps every afternoon, even when it rained.","Jamal played games on his phone.","The meet was in the county."],a:1,hint:"Which detail shows hard work paying off?",why:"Lena's steady practice, even in the rain, is why she wins. That supports the theme about hard work."},
   {t:"write",d:2,q:"Write the theme of \"The Last Lap\" in a complete sentence. Then give one detail from the story that supports it.",starters:["The theme of the story is ___.","One detail that supports this is ___.","This shows ___."],look:["hard work","practice","talent","lena","rain","success","theme"],model:"The theme of the story is that talent alone is not enough, and steady hard work leads to success. One detail that supports this is that Lena ran her laps every afternoon, even in the rain, and she won the race."}
  ]},
{ id:"povpoem", g:"prose", color:"#d64f8a", title:"Point of View & Poetry", blurb:"Narrators, poem forms & structure",
  learn:[
   {h:"Who is telling the story?", html:`<ul><li><span class="term">First person</span>: the narrator is a character and uses <b>I, me, we</b>.</li>
   <li><span class="term">Third person limited</span>: an outside narrator uses <b>he, she, they</b> and knows the thoughts of <b>one</b> character.</li>
   <li><span class="term">Third person omniscient</span>: an outside narrator knows <b>everyone's</b> thoughts.</li></ul>
   <div class="tip">The narrator controls what readers know. A different narrator would tell a different story!</div>`},
   {h:"Poem parts and forms", html:`<ul><li><span class="term">Line</span> and <span class="term">stanza</span> (a group of lines, like a paragraph).</li>
   <li><span class="term">Rhyme scheme</span>: rhyming line endings labeled with letters, like AABB or ABAB.</li>
   <li><span class="term">Free verse</span>: no set rhyme or rhythm.</li>
   <li><span class="term">Haiku</span>: 3 lines, 5-7-5 syllables, often about nature.</li>
   <li><span class="term">Limerick</span>: 5 lines, AABBA, usually funny.</li>
   <li><span class="term">Rhymed verse</span>: has a rhyme pattern and a steady beat.</li></ul>
   <div class="tip">A poem's <b>form</b> helps its meaning: short lines slow you down, rhyme can make a poem playful, and a haiku captures one quiet moment.</div>`}
  ],
  example:{q:`"She wondered if anyone would notice she was gone." What point of view is this?`,a:`<b>Third person limited.</b> The narrator uses she and tells only one character's thoughts.`},
  qs:[
   {t:"mc",d:1,q:`"I grabbed my bag and raced to the bus stop." What point of view is this?`,opts:["first person","third person limited","third person omniscient","no point of view"],a:0,hint:"Look at the pronouns.",why:"The narrator uses I and my, so it is first person."},
   {t:"mc",d:2,passage:`Marcus stared at the test. He knew he had studied, but his mind went blank. Across the room, Kayla tapped her pencil.`,q:"What can the reader know in this passage?",opts:["Only Marcus's thoughts","Only Kayla's thoughts","Both characters' thoughts","No one's thoughts"],a:0,hint:"Whose mind does the narrator tell us about? What do we learn about Kayla?",why:"We know Marcus's thoughts, but we only see what Kayla does. This is third person limited."},
   {t:"mc",d:2,q:`In "The Last Lap," the narrator tells us what Jamal says and does. If Lena told the story in first person, readers would most likely learn…`,opts:["Lena's thoughts about practicing and the race","Jamal's secret thoughts","nothing new","what the coach was thinking"],a:0,hint:"A first-person narrator knows her own thoughts.",why:"Lena as narrator would share her own thoughts, like why she practiced in the rain."},
   {t:"mc",d:1,passage:`<div class="poem">Snowflakes softly fall
covering the sleeping field
winter holds its breath</div>`,q:"What form is this poem?",opts:["limerick","haiku","free verse","rhymed verse"],a:1,hint:"Count the lines and syllables.",why:"It has 3 lines with 5-7-5 syllables about nature. That is a haiku."},
   {t:"mc",d:1,passage:`<div class="poem">The puppy chased the yellow ball,
It bounced across the kitchen floor.
He skidded past the hallway wall,
Then barked to play some more!</div>`,q:"What is the rhyme scheme?",opts:["AABB","ABAB","AABBA","no rhyme"],a:1,hint:"Ball, floor, wall, more. Which ones rhyme?",why:"Ball and wall rhyme (A), floor and more rhyme (B). The pattern is ABAB."},
   {t:"mc",d:2,q:"How does the short, 3-line form of the haiku help its meaning?",opts:["It makes the poem silly and loud.","It creates a quiet, still moment, like snow falling.","It tells a long story.","It makes the poem rhyme."],a:1,hint:"Think about how the poem feels when you read it slowly.",why:"The short, simple lines feel calm and quiet, just like a snowy field."}
  ]},
/* ================= INFORMATIONAL ================= */
{ id:"central", g:"info", color:"#3f9b3a", title:"Central Idea & Structure", blurb:"Main point & how it's organized",
  learn:[
   {h:"Central idea", html:`<ul><li><span class="term">Topic</span>: what the text is about in a few words.</li>
   <li><span class="term">Central idea</span>: the most important point about the topic, in a full sentence. It fits the <b>whole</b> text.</li>
   <li><span class="term">Supporting details</span>: facts and examples that prove the central idea.</li></ul>`},
   {h:"Text structure", html:`<ul><li><span class="term">Chronological</span>: time order. <i>first, then, later</i></li>
   <li><span class="term">Cause and effect</span>: why and what happened. <i>because, as a result, so</i></li>
   <li><span class="term">Compare and contrast</span>: alike and different. <i>both, however, unlike</i></li>
   <li><span class="term">Problem and solution</span>: a problem and a fix. <i>problem, to solve this</i></li>
   <li><span class="term">Description</span>: details about one thing. <i>for example, such as</i></li></ul>
   <div class="tip">Signal words are your keys. Circle them as you read!</div>`}
  ],
  example:{q:`"Because it rained all week, the field flooded. As a result, the game was canceled." What structure?`,a:`<b>Cause and effect.</b> <i>Because</i> and <i>as a result</i> show what caused the flood and what happened next.`},
  passage:{title:"Lights Out for Sea Turtles",lines:[
   "Every summer, thousands of sea turtles crawl onto Florida's beaches to lay their eggs in the sand.",
   "About two months later, tiny hatchlings dig out of their nests, usually at night.",
   "Hatchlings find the ocean by heading toward the brightest light, which is normally the moon and stars shining over the water.",
   "However, bright lights from homes, hotels, and streets can confuse them. As a result, many hatchlings crawl the wrong way, toward roads and parking lots.",
   "To solve this problem, many beach towns ask people to turn off or cover outdoor lights during nesting season.",
   "Beach visitors can help too by filling in holes, picking up trash, and leaving nests alone."]},
  qs:[
   {t:"mc",d:1,q:"What is the <b>topic</b> of the passage?",opts:["Florida hotels","sea turtle hatchlings on Florida beaches","the moon and stars","parking lots"],a:1,hint:"What is the whole passage about?",why:"Every paragraph is about sea turtle hatchlings on Florida's beaches."},
   {t:"mc",d:2,q:"Which sentence BEST states the <b>central idea</b>?",opts:["Sea turtles lay eggs in the sand.","Hatchlings come out at night.","Bright lights confuse sea turtle hatchlings, but people can help protect them.","Hotels have bright lights."],a:2,hint:"Which choice covers the WHOLE passage?",why:"This choice covers the problem (lights) and the help (people), which is what the whole passage is about."},
   {t:"mc",d:1,q:`In paragraph 4, the words "as a result" signal which text structure?`,opts:["chronological","cause and effect","compare and contrast","description"],a:1,hint:"What does as a result tell you?",why:"As a result shows an effect. Lights (cause) make hatchlings go the wrong way (effect)."},
   {t:"mc",d:2,q:"How are paragraphs 4 and 5 organized together?",opts:["problem and solution","compare and contrast","chronological","description"],a:0,hint:"Paragraph 5 starts with 'To solve this problem…'",why:"Paragraph 4 gives a problem (confusing lights) and paragraph 5 gives a solution (turning off lights)."},
   {t:"tap",d:2,q:"Tap the sentence that tells what regular <b>beach visitors</b> can do to help.",a:5,hint:"Look for the words beach visitors.",why:"The last paragraph says beach visitors can fill holes, pick up trash, and leave nests alone."},
   {t:"mc",d:2,q:"Why is paragraph 3 important to the central idea?",opts:["It explains how hatchlings find the ocean, so we understand why lights are a problem.","It tells how many eggs a turtle lays.","It describes Florida hotels.","It gives the author's opinion."],a:0,hint:"What would you not understand without paragraph 3?",why:"Paragraph 3 explains that hatchlings follow light, which is why bright lights confuse them."},
   {t:"write",d:2,q:"Write a 2-sentence summary of \"Lights Out for Sea Turtles.\" Start with the central idea.",starters:["The central idea is that ___.","Lights cause ___, so ___.","People can help by ___."],look:["light","hatchling","turtle","help","confuse","solve","beach"],model:"Bright lights confuse sea turtle hatchlings on Florida beaches, but people can help protect them. Because hatchlings follow light to the ocean, towns ask people to turn off lights, and beach visitors can fill holes and pick up trash."}
  ]},
{ id:"argue", g:"info", color:"#e09f1f", title:"Purpose, Perspective & Argument", blurb:"Why authors write & how they argue",
  learn:[
   {h:"Purpose and perspective", html:`<ul><li><span class="term">Author's purpose</span>: why the author wrote: to <b>persuade</b>, <b>inform</b>, <b>explain</b>, or <b>entertain</b>.</li>
   <li><span class="term">Author's perspective</span>: how the author <b>thinks or feels</b> about the topic. Look at word choice! Strong words like <i>must, should, unfair</i> show opinions.</li></ul>`},
   {h:"Parts of an argument", html:`<ul><li><span class="term">Claim</span>: the author's main position.</li>
   <li><span class="term">Reasons</span>: why the author believes the claim.</li>
   <li><span class="term">Evidence</span>: facts, examples, or expert ideas that prove the reasons.</li>
   <li><span class="term">Counterclaim</span>: what the other side says.</li>
   <li><span class="term">Rebuttal</span>: the author's answer to the other side.</li></ul>
   <div class="tip"><b>Relevant</b> evidence connects to the claim. <b>Irrelevant</b> evidence is off topic and does not help the argument.</div>`}
  ],
  example:{q:`Claim: "Our school should start later." Is "I like pancakes for breakfast" relevant evidence?`,a:`<b>No.</b> Pancakes have nothing to do with start times. Relevant evidence would be something like "Students who get more sleep pay better attention in class."`},
  passage:{title:"Keep Recess for Everyone (a student letter)",lines:[
   "Teachers should stop taking away recess as a punishment.",
   "Recess gives students a chance to move their bodies, and moving helps the brain focus.",
   "Researchers have found that many students pay better attention in class after a break to play.",
   "Some people say that losing recess teaches students to follow the rules.",
   "However, there are better consequences, like a short talk with the teacher or writing a plan to fix the problem.",
   "Also, my favorite color is blue, and the playground slide is blue."]},
  qs:[
   {t:"tap",d:1,q:"Tap the sentence that states the author's <b>claim</b>.",a:0,hint:"The claim is what the author wants.",why:"The author's main position is that teachers should stop taking away recess."},
   {t:"mc",d:1,q:"What is the author's main <b>purpose</b>?",opts:["to entertain with a funny story","to persuade teachers to keep recess","to explain how to build a playground","to inform readers about the color blue"],a:1,hint:"The author uses the word should.",why:"The author wants teachers to change what they do, so the purpose is to persuade."},
   {t:"tap",d:2,q:"Tap the sentence that is a <b>counterclaim</b>.",a:3,hint:"Look for what 'some people say.'",why:"'Some people say…' introduces the other side's view. That is the counterclaim."},
   {t:"tap",d:2,q:"Tap the sentence that is <b>irrelevant</b> and does not support the claim.",a:5,hint:"Which sentence has nothing to do with taking away recess?",why:"The author's favorite color doesn't support keeping recess. It is irrelevant."},
   {t:"mc",d:2,q:"Which best describes the author's <b>perspective</b>?",opts:["Recess is a waste of time.","Recess is important for learning and should not be taken away.","Students should be punished more.","The author does not care about recess."],a:1,hint:"Look at the claim and reasons together.",why:"The author believes recess helps students learn and should be kept for everyone."},
   {t:"mc",d:2,q:"Which evidence would BEST strengthen the author's argument?",opts:["Recess is my favorite part of the day.","The playground has new swings.","A school report showed fewer behavior problems after recess was given to every student.","My friend likes recess too."],a:2,hint:"Strong evidence is a fact that connects to the claim, not an opinion.",why:"A school report is factual evidence that directly supports keeping recess. The others are opinions or off topic."},
   {t:"write",d:2,q:"Explain why the last sentence about the color blue does NOT support the claim. Then write a better sentence the author could use instead.",starters:["The sentence about blue does not support the claim because ___.","A better sentence would be: ___."],look:["claim","recess","irrelevant","does not","because","evidence"],model:"The sentence about blue does not support the claim because the author's favorite color has nothing to do with taking away recess. A better sentence would be: Students who get recess have more energy to finish their work in the afternoon."}
  ]}
];

/* ============ STATE (autosaves on this device) ============ */
const SAVE_KEY = "ll-skill-vault-powerup-v1";
let S = {name:"", view:"home", st:0, step:0, ans:{}, celebrated:{}, finale:false};
function load(){ try{ const raw = localStorage.getItem(SAVE_KEY); if(raw){ S = Object.assign(S, JSON.parse(raw)); } }catch(e){} }
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
load();

const PRAISE = ["Way to go!","You unlocked it!","Brilliant thinking!","Nailed it!","Locksmith level up!","You're on fire!","Super reader move!","Fantastic!","Yes! Great job!","You've got the key!"];
const RETRY = ["So close! You've got this.","Good try! Use the hint and try again.","Keep going, every locksmith tries more than one key!"];
const pick = a => a[Math.floor(Math.random()*a.length)];

function stepsFor(st){
  const s = STATIONS[st], out=[];
  s.learn.forEach((l,i)=>out.push({kind:"learn",i}));
  if(s.example) out.push({kind:"example"});
  s.qs.forEach((q,i)=>out.push({kind:"q",i}));
  out.push({kind:"done"});
  return out;
}
const qid = (st,i)=>STATIONS[st].id+"-"+i;
function stationDone(st){ return STATIONS[st].qs.every((q,i)=>S.ans[qid(st,i)] && S.ans[qid(st,i)].status); }
function points(){ let p=0; Object.values(S.ans).forEach(a=>{ if(a.status==="right")p+=10; else if(a.status==="second")p+=5; else if(a.status==="written")p+=10; else if(a.status==="missed")p+=2; }); return p; }
function updateScore(){ document.getElementById("scoreNum").textContent = points(); }

/* ============ READ ALOUD (Google US English voice) ============ */
let VOICE=null;
function pickVoice(){ try{ const v = speechSynthesis.getVoices(); VOICE = v.find(x=>x.name==="Google US English") || v.find(x=>x.lang==="en-US" && /Google/.test(x.name)) || v.find(x=>x.lang==="en-US") || null; }catch(e){} }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(el){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const clone = el.cloneNode(true); clone.querySelectorAll(".no-read,svg,.speak,textarea,.starters,.nav").forEach(n=>n.remove());
  let txt = clone.innerText.replace(/ELA\.[A-Z0-9.]+/g,"").replace(/[🔑⭐🎉✨🔊]/g,"").replace(/\s+/g," ").trim();
  const u = new SpeechSynthesisUtterance(txt); if(VOICE) u.voice=VOICE; u.lang="en-US"; u.rate=.95;
  speechSynthesis.speak(u);
}
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} }

/* ============ CELEBRATION ============ */
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function popConfetti(){ if(window.confetti) confetti({particleCount:70,spread:70,origin:{y:.75},colors:["#f2b705","#2a9d8f","#e76f51","#7b4fd6","#2c7be5"]}); }
function bigConfetti(){ if(!window.confetti) return; const end=Date.now()+2200; (function f(){ confetti({particleCount:6,angle:60,spread:60,origin:{x:0}}); confetti({particleCount:6,angle:120,spread:60,origin:{x:1}}); if(Date.now()<end) requestAnimationFrame(f); })(); confetti({particleCount:160,spread:110,origin:{y:.6}}); }

/* ============ RENDER ============ */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function go(view,st,step){ stopSpeak(); S.view=view; if(st!==undefined)S.st=st; if(step!==undefined)S.step=step; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

function render(){
  updateScore();
  if(!S.name){ return renderWelcome(); }
  if(S.view==="station") return renderStation();
  if(S.view==="finale") return renderFinale();
  renderHome();
}

function renderWelcome(){
  app.innerHTML = `<section class="hero"><h1>Skill Vault Power-Up</h1><p>Unlock ${STATIONS.length} skill locks. Learn each skill, practice it, and earn a golden key. Your answers save on this iPad, so you can leave and come right back.</p></section>
  <div class="card" style="--c:#2a9d8f"><h3>Welcome, Locksmith!</h3><p>Type your first name to start your key ring.</p>
  <form class="name-row" id="nameForm"><input type="text" id="nameIn" autocomplete="off" placeholder="First name" aria-label="First name"><button class="btn" type="submit">Start →</button></form></div>`;
  document.getElementById("nameForm").addEventListener("submit",e=>{e.preventDefault(); const v=document.getElementById("nameIn").value.trim(); if(!v){toast("Type your name first!");return;} S.name=v.slice(0,30); save(); popConfetti(); toast("Welcome, "+S.name+"!"); render();});
}

function renderHome(){
  const doneCount = STATIONS.filter((s,i)=>stationDone(i)).length;
  if(doneCount===STATIONS.length && !S.finale){ S.finale=true; save(); return go("finale"); }
  app.innerHTML = `<section class="hero"><h1>Hi, ${esc(S.name)}!</h1><p>You have <b style="color:var(--gold)">${doneCount} of ${STATIONS.length}</b> keys. Start with Lock 1 and work your way down. Tap any lock to begin or keep going.</p></section>
  ${GROUPS.map(G=>`<h2 class="grp">${G.title}</h2><p class="grp-note">${G.note}</p><div class="map">${STATIONS.map((s,i)=>{ if(s.g!==G.g) return ""; const d=stationDone(i); const started=s.qs.some((q,j)=>S.ans[qid(i,j)]); return `<button class="lock ${d?"done":""}" style="--c:${s.color}" data-st="${i}">
     ${d?`<span class="keyicon">${KEY_SVG("#c98f00")}</span>`:""}
     <span class="num">Lock ${i+1}</span><h3>${s.title}</h3><p>${s.blurb}</p>
     <span class="status">${d?"Key earned ✓":started?"Keep going →":"Start →"}</span></button>`}).join("")}</div>`).join("")}
  ${doneCount===STATIONS.length?`<div class="nav"><button class="btn" id="toFinale">See my certificate 🎉</button></div>`:""}`;
  app.querySelectorAll(".lock").forEach(b=>b.addEventListener("click",()=>{ const st=+b.dataset.st; const steps=stepsFor(st); let resume=0; if(S.st===st && S.step) resume=S.step; go("station",st,Math.min(resume,steps.length-1)); }));
  const f=document.getElementById("toFinale"); if(f) f.onclick=()=>go("finale");
}

function passageHTML(s){
  if(s.passageHtml) return s.passageHtml;
  if(!s.passage) return "";
  return `<div class="passage"><div class="pt">${s.passage.title}</div>${s.passage.lines.map(l=>`<p style="margin:0 0 8px">${l}</p>`).join("")}</div>`;
}

function renderStation(){
  const s = STATIONS[S.st], steps = stepsFor(S.st);
  if(S.step>=steps.length) S.step=steps.length-1;
  const step = steps[S.step];
  const pct = Math.round((S.step)/(steps.length-1)*100);
  let body="", canNext=true, label="";
  if(step.kind==="learn"){ const l=s.learn[step.i]; label="Learn it"; body=`<h3>${l.h}</h3>${l.html}`; }
  else if(step.kind==="example"){ label="Try it together"; body=`<h3>Watch me unlock one</h3><p class="q">${s.example.q}</p><p>Think about it first. Then tap to check your thinking.</p><button class="btn dark no-read" id="reveal">Show the answer</button><div class="example-reveal" id="exAns" hidden><div class="feedback good"><b class="big">Here's how a locksmith thinks:</b>${s.example.a}</div></div>`; }
  else if(step.kind==="q"){ const q=s.qs[step.i]; label=q.t==="write"?"Write it":"Practice "+(step.i+1)+" of "+s.qs.length; body=questionHTML(s,q,step.i); canNext=!!(S.ans[qid(S.st,step.i)]&&S.ans[qid(S.st,step.i)].status); }
  else { label="Key unlocked"; body=doneHTML(s); }
  app.innerHTML = `<div class="station-head"><div><div class="eyebrow">Lock ${S.st+1} of ${STATIONS.length}</div><h2>${s.title}</h2></div><button class="btn ghost" id="toMap" style="color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)">← Key map</button></div>
  <div class="progress" aria-label="Progress"><i style="width:${pct}%"></i></div>
  <article class="card" id="card" style="--c:${s.color}"><button class="speak no-read" id="speakBtn">🔊 Read to me</button><span class="step-tag no-read">${label}</span>${body}
  <div class="nav no-read"><button class="btn ghost" id="back" ${S.step===0?"disabled":""}>← Back</button>
  ${step.kind==="done"?`<button class="btn" id="next">${S.st<STATIONS.length-1?"Next lock →":"Finish 🎉"}</button>`:`<button class="btn" id="next" ${canNext?"":"disabled"}>Next →</button>`}</div></article>`;
  document.getElementById("toMap").onclick=()=>go("home");
  document.getElementById("speakBtn").onclick=()=>speak(document.getElementById("card"));
  document.getElementById("back").onclick=()=>go("station",S.st,S.step-1);
  document.getElementById("next").onclick=()=>{
    if(step.kind==="done"){ if(S.st<STATIONS.length-1) go("station",S.st+1,0); else go("finale"); }
    else go("station",S.st,S.step+1);
  };
  const r=document.getElementById("reveal"); if(r) r.onclick=()=>{ document.getElementById("exAns").hidden=false; r.hidden=true; popConfetti(); };
  if(step.kind==="q") wireQuestion(s,s.qs[step.i],step.i);
  if(step.kind==="done" && !S.celebrated[s.id]){ S.celebrated[s.id]=true; save(); setTimeout(bigConfetti,250); }
}

function doneHTML(s){
  const st=S.st; let right=0,total=0;
  s.qs.forEach((q,i)=>{ const a=S.ans[qid(st,i)]; if(q.t!=="write"){ total++; if(a&&(a.status==="right"||a.status==="second")) right++; } });
  const all = stationDone(st);
  if(!all) return `<div class="center"><h3>Almost there!</h3><p>You still have some practice to finish in this lock. Tap Back to find it.</p></div>`;
  return `<div class="center"><span class="bigkey">${KEY_SVG(s.color)}</span><h3>Key unlocked: ${s.title}!</h3>
  <p>Amazing work, ${esc(S.name)}! You got <b>${right} of ${total}</b> practice questions and finished your writing. Every key you earn makes you a stronger reader.</p>
  <p>${pick(["Your brain just grew a little bigger!","That's how real locksmiths work: one key at a time.","You should be proud of yourself!"])}</p></div>`;
}

/* ---------- question HTML ---------- */
function questionHTML(s,q,i){
  const a=S.ans[qid(S.st,i)]||{};
  let h = "";
  if(q.t==="tap"){ h+=`<div class="passage"><div class="pt">${s.passage.title}</div>${s.passage.lines.map((l,k)=>`<button class="tapline" data-k="${k}">${l}</button>`).join("")}</div>`; }
  else { if(q.passage) h+=`<div class="passage">${q.passage}</div>`; else if(s.passage||s.passageHtml) h+=passageHTML(s); }
  h+=`<span class="dok no-read">${q.d===1?"DOK 1 · Remember it":"DOK 2 · Use it"}</span><p class="q">${q.q}</p>`;
  if(q.t==="mc"){ h+=`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="ltr">${"ABCDE"[k]}</span><span>${o}</span></button>`).join("")}</div>`; }
  if(q.t==="multi"){ h+=`<p class="no-read" style="font-size:15px;color:var(--muted)">Tap every answer that fits, then tap Check.</p><div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="false"><span class="ltr">${"ABCDE"[k]}</span><span>${o}</span></button>`).join("")}</div><div class="nav no-read" style="justify-content:flex-start"><button class="btn dark" id="check">Check</button></div>`; }
  if(q.t==="order"){ h+=`<p class="no-read" style="font-size:15px;color:var(--muted)">Tap the cards in the correct order. Tap Start over to try again.</p><div class="order-ans" id="oAns"></div><div class="order-bank" id="oBank"></div><div class="nav no-read" style="justify-content:flex-start"><button class="btn dark" id="check">Check</button><button class="btn ghost" id="oReset">Start over</button></div>`; }
  if(q.t==="write"){ h+=`<div class="starters no-read">${q.starters.map(t=>`<button type="button" data-s="${esc(t)}">+ ${esc(t)}</button>`).join("")}</div>
   <textarea id="wbox" aria-label="Your answer" placeholder="Type or write with your Apple Pencil here…">${esc(a.text||"")}</textarea><div class="wc no-read" id="wc"></div>
   <div class="nav no-read" style="justify-content:flex-start"><button class="btn dark" id="submitW">Submit my writing</button></div>`; }
  h+=`<div id="fb"></div>`;
  return h;
}

function setAns(i,obj){ S.ans[qid(S.st,i)] = Object.assign(S.ans[qid(S.st,i)]||{},obj); save(); updateScore(); }
function enableNext(){ const n=document.getElementById("next"); if(n) n.disabled=false; }
function fb(kind,title,msg){ document.getElementById("fb").innerHTML=`<div class="feedback ${kind}"><b class="big">${title}</b>${msg}</div>`; }

function wireQuestion(s,q,i){
  const key=qid(S.st,i); const a=S.ans[key]||{};
  const finished = !!a.status;

  if(q.t==="mc"||q.t==="tap"){
    const sel = q.t==="mc"?".opt":".tapline";
    const btns=[...app.querySelectorAll(sel)];
    const show=()=>{ btns.forEach(b=>{ const k=+b.dataset.k; if(k===q.a) b.classList.add("right"); else if((a.wrong||[]).includes(k)) b.classList.add("wrong"); b.disabled=true; }); };
    (a.wrong||[]).forEach(k=>{ btns[k].classList.add("wrong"); btns[k].disabled=true; });
    if(finished){ show(); fb(a.status==="missed"?"miss":"good", a.status==="missed"?"Here's the key:":"You got it!", q.why); return; }
    btns.forEach(b=>b.addEventListener("click",()=>{
      const k=+b.dataset.k; const cur=S.ans[key]||{wrong:[]}; const wrong=cur.wrong||[];
      if(k===q.a){ setAns(i,{status:wrong.length?"second":"right",wrong}); a.wrong=wrong; show(); fb("good",pick(PRAISE)+" ✨",q.why); popConfetti(); toast(wrong.length?"+5 key points":"+10 key points"); enableNext(); }
      else{ wrong.push(k); a.wrong=wrong; b.classList.add("wrong"); b.disabled=true;
        if(wrong.length>=2){ setAns(i,{status:"missed",wrong}); show(); fb("miss","Good effort! Here's the key:",q.why+" <br><br>Now you know it for next time. Keep going!"); enableNext(); }
        else { setAns(i,{wrong}); fb("hint",pick(RETRY),"💡 Hint: "+q.hint); } }
    }));
  }

  if(q.t==="multi"){
    const btns=[...app.querySelectorAll(".opt")]; const chosen=new Set(a.picked||[]);
    const paint=()=>btns.forEach(b=>{ const on=chosen.has(+b.dataset.k); b.classList.toggle("sel",on); b.setAttribute("aria-pressed",on); });
    const reveal=()=>{ btns.forEach(b=>{ const k=+b.dataset.k; b.classList.remove("sel"); if(q.a.includes(k)) b.classList.add("right"); else if(chosen.has(k)) b.classList.add("wrong"); b.disabled=true; }); document.getElementById("check").hidden=true; };
    paint();
    if(finished){ reveal(); fb(a.status==="missed"?"miss":"good",a.status==="missed"?"Here's the key:":"You got it!",q.why); return; }
    btns.forEach(b=>b.addEventListener("click",()=>{ const k=+b.dataset.k; chosen.has(k)?chosen.delete(k):chosen.add(k); paint(); }));
    document.getElementById("check").onclick=()=>{
      if(!chosen.size){ toast("Pick at least one!"); return; }
      const ok = chosen.size===q.a.length && q.a.every(k=>chosen.has(k));
      const tries=(S.ans[key]&&S.ans[key].tries)||0;
      if(ok){ setAns(i,{status:tries?"second":"right",picked:[...chosen]}); reveal(); fb("good",pick(PRAISE)+" ✨",q.why); popConfetti(); toast(tries?"+5 key points":"+10 key points"); enableNext(); }
      else if(tries>=1){ setAns(i,{status:"missed",picked:[...chosen],tries:2}); reveal(); fb("miss","Good effort! Here's the key:",q.why); enableNext(); }
      else { setAns(i,{tries:1}); fb("hint",pick(RETRY),"💡 Hint: "+q.hint); }
    };
  }

  if(q.t==="order"){
    const bank=document.getElementById("oBank"), ans=document.getElementById("oAns");
    let order=[]; const shuffled=q.items.map((t,k)=>k).sort(()=>Math.random()-.5);
    if(shuffled.every((v,k)=>v===k)) shuffled.reverse();
    const draw=()=>{
      ans.innerHTML = order.length?order.map((k,n)=>`<div class="opt" style="cursor:default"><span class="ltr">${n+1}</span><span>${q.items[k]}</span></div>`).join(""):`<span style="color:var(--muted);padding:6px">Your order will appear here.</span>`;
      bank.innerHTML = shuffled.filter(k=>!order.includes(k)).map(k=>`<button class="opt" data-k="${k}"><span class="ltr">+</span><span>${q.items[k]}</span></button>`).join("");
      bank.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ order.push(+b.dataset.k); draw(); });
    };
    const final=()=>{ order=q.items.map((t,k)=>k); draw(); ans.querySelectorAll(".opt").forEach(e=>e.classList.add("right")); document.getElementById("check").hidden=true; document.getElementById("oReset").hidden=true; };
    if(finished){ final(); fb(a.status==="missed"?"miss":"good",a.status==="missed"?"Here's the correct order:":"You got it!",q.why); return; }
    draw();
    document.getElementById("oReset").onclick=()=>{ order=[]; draw(); };
    document.getElementById("check").onclick=()=>{
      if(order.length<q.items.length){ toast("Place every card first!"); return; }
      const ok=order.every((v,k)=>v===k); const tries=(S.ans[key]&&S.ans[key].tries)||0;
      if(ok){ setAns(i,{status:tries?"second":"right"}); final(); fb("good",pick(PRAISE)+" ✨",q.why); popConfetti(); toast(tries?"+5 key points":"+10 key points"); enableNext(); }
      else if(tries>=1){ setAns(i,{status:"missed",tries:2}); final(); fb("miss","Good effort! Here's the correct order:",q.why); enableNext(); }
      else { setAns(i,{tries:1}); order=[]; draw(); fb("hint",pick(RETRY),"💡 Hint: "+q.hint); }
    };
  }

  if(q.t==="write"){
    const box=document.getElementById("wbox"), wc=document.getElementById("wc");
    const count=()=>{ const n=(box.value.trim().match(/\S+/g)||[]).length; wc.textContent=n+" words · aim for at least 20 · saved on this iPad"; return n; };
    count();
    box.addEventListener("input",()=>{ setAns(i,{text:box.value}); count(); });
    app.querySelectorAll(".starters button").forEach(b=>b.onclick=()=>{ box.value=(box.value.trim()?box.value.trimEnd()+" ":"")+b.dataset.s+" "; box.focus(); setAns(i,{text:box.value}); count(); });
    const praise=()=>{ const txt=box.value.toLowerCase(); const hits=q.look.filter(w=>txt.includes(w)); const extra = hits.length>=2?"You used strong skill words like <b>"+hits.slice(0,3).join(", ")+"</b>. That shows real understanding!":"Nice job putting your thinking into words!";
      fb("good","Writing saved! "+pick(PRAISE)+" 📝",extra+`<div class="model"><b>Compare with a model answer:</b><br>${q.model}<br><br><i>Does your answer have the same key ideas? You can still add to yours above.</i></div>`); };
    if(finished){ praise(); }
    document.getElementById("submitW").onclick=()=>{
      const n=count();
      if(n<12){ fb("hint","Keep building!","Write a little more. Try using the sentence starters above. Aim for at least 20 words."); return; }
      const first=!S.ans[key].status; setAns(i,{status:"written",text:box.value}); praise(); if(first){ popConfetti(); toast("+10 key points"); } enableNext();
    };
  }
}

function renderFinale(){
  const rows = STATIONS.map((s,i)=>{ let r=0,t=0; s.qs.forEach((q,j)=>{ if(q.t!=="write"){t++; const a=S.ans[qid(i,j)]; if(a&&(a.status==="right"||a.status==="second"))r++;} }); return {s,r,t,done:stationDone(i)}; });
  const allDone = rows.every(x=>x.done);
  const date = new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
  app.innerHTML = `<div class="card cert" style="--c:#f2b705">
   <span class="bigkey">${KEY_SVG("#c98f00")}</span>
   <h2>${allDone?"Master Locksmith":"Keep unlocking!"}</h2>
   <p>${allDone?"This certifies that":"You're doing great,"}</p>
   <div class="who">${esc(S.name)}</div>
   <p>${allDone?"unlocked all "+STATIONS.length+" reading skill locks with "+points()+" key points.":"Finish the rest of the locks to earn your Master Locksmith certificate."}</p>
   <p style="color:var(--muted)">${date}</p>
   <div class="tally">${rows.map(x=>`<div><b>${x.s.title}</b><br>${x.done?x.r+" / "+x.t+" correct ✓":"not finished yet"}</div>`).join("")}</div>
   <p class="no-read">Show this screen to your teacher, or tap Copy my results to paste them into Canvas.</p>
   <div class="nav" style="justify-content:center"><button class="btn" id="copyRes">Copy my results</button><button class="btn ghost" id="toMap2">← Key map</button></div>
  </div>`;
  if(allDone){ setTimeout(bigConfetti,200); setTimeout(bigConfetti,1600); toast("You did it, "+S.name+"! 🎉"); }
  document.getElementById("toMap2").onclick=()=>go("home");
  document.getElementById("copyRes").onclick=()=>{
    let txt=`Skill Vault Power-Up – ${S.name} – ${date}\nKey points: ${points()}\n\n`;
    rows.forEach((x,i)=>{ txt+=`${x.s.title}: ${x.done?x.r+"/"+x.t+" correct":"not finished"}\n`; x.s.qs.forEach((q,j)=>{ if(q.t==="write"){ const a=S.ans[qid(i,j)]; txt+=`  Writing: ${a&&a.text?a.text.trim():"(blank)"}\n`; } }); });
    navigator.clipboard.writeText(txt).then(()=>toast("Copied! Paste it in Canvas.")).catch(()=>{ const ta=document.createElement("textarea"); ta.value=txt; ta.style.width="100%"; ta.rows=8; document.querySelector(".cert").appendChild(ta); ta.select(); toast("Select all and copy the box below."); });
  };
}

render();
</script>

</body></html>
